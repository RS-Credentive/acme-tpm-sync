# Base directory for all files to be read/written
acmetpm.baseDirectory               :/etc/acmetpm

certificates.signatureAlgorithm     :SHA256withECDSA

# The number of days left in a certificate lifecycle when it should be renewed
domains.renewalLimit                :90

# The URI of the EJBCA server we should connect to
# RA Server
ejbca.sessionUri                    :https://10.22.65.12
# CA Server
#ejbca.sessionUri                   :https://10.22.65.16

# Token information
token.label             :label
token.password          :myuserpin
token.libraryPath       :/usr/lib64/pkcs11/libtpm2_pkcs11.so
token.userAlias         :userKeyPair
token.truststore        :/etc/acmetpm/idmsTrustStore.p12
token.jcaConfigFile     :/etc/acmetpm/acmetpm.conf